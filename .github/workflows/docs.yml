name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python3 -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Generate HTML
        run: python3 build_docs.py

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- README.html ARCHITECTURE.html index.html; then
            echo "Documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.html ARCHITECTURE.html index.html
          git commit -m "docs: rebuild HTML [skip ci]"
          git push
